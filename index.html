<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Ensino: Camadas de Software</title>
    <style>
        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        } 

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
            padding: 40px 20px;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header-principal {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-principal h1 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .header-principal h4 {
            font-size: 14px;
            font-style: italic;
            font-weight: normal;
        }

        /* Painel Superior e Formulário Integrado */
        .formulario-painel {
            background-color: #f9f9f9;
            border: 1px dashed #000000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .formulario-painel input, .formulario-painel textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            font-family: inherit;
            font-size: 14px;
        }

        .linha-acoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .status-sync {
            font-size: 13px;
            color: #555555;
            font-style: italic;
        }

        .btn-acao {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn-acao:hover {
            background-color: #e0e0e0;
        }

        .btn-salvar {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-salvar:hover {
            background-color: #333333;
        }

        .btn-salvar:disabled {
            background-color: #cccccc;
            border-color: #cccccc;
            cursor: not-allowed;
        }

        .lista-cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .titulo-secao {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            border-bottom: 2px solid #000000;
            padding-bottom: 3px;
        }

        .card { 
            background-color: #ffffff; 
            border: 1px solid #000000;
            padding: 15px 20px;
            position: relative; 
        }

        .card h3 {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            padding-right: 30px;
        }

        .card p {
            font-size: 14px;
            text-align: justify;
        }

        .card-aviso {
            background-color: #fcfcfc;
            border-left: 5px solid #000000;
        }

        .btn-excluir {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #000000;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            opacity: 0.3;
        }

        .btn-excluir:hover {
            opacity: 1;
            color: #ff0000;
        }

        .msg-aviso {
            text-align: center;
            font-style: italic;
            padding: 20px;
        }
    </style> 
</head> 
<body> 

    <div class="wrapper">
        <header class="header-principal">
            <h1>CAMADAS DE UM SOFTWARE:</h1> 
            <h4>Conforme o tamanho e a complexidade do sistema novas camadas podem ser criadas, mas em geral são essas:</h4> 
        </header> 

        <!-- Formulário de Entrada que Conecta com a sua API do Google -->
        <form class="formulario-painel" id="formCadastro">
            <input type="text" id="tituloInput" placeholder="Título do Bloco (ex: Camada de Segurança:)" required>
            <textarea id="textoInput" rows="2" placeholder="Digite a descrição ou conteúdo programático aqui..." required></textarea>
            
            <div class="linha-acoes">
                <span class="status-sync" id="statusTexto">Sincronizando com o documento online...</span>
                <div>
                    <button type="button" class="btn-acao" onclick="carregarDadosGoogleDocs()">🔄 Sincronizar</button>
                    <button type="submit" class="btn-acao btn-salvar" id="btnSalvar">💾 Salvar no Google Docs</button>
                </div>
            </div>
        </form>

        <div class="lista-cards" id="listaCards">
            <div class="msg-aviso">Buscando conteúdo no Google Docs...</div>
        </div> 
    </div>

    <script>
        // O link de Leitura Pública (Mantido do passo anterior)
        const URL_LEITURA_PUB = "https://google.com";
        
        // A SUA NOVA URL DA API DE ESCRITA QUE VOCÊ ENVIOU
        const URL_ESCRITA_API = "https://script.google.com/macros/s/AKfycbwGcNLKZ7c0jN8sF6vuX1L4_M-K1IIMJOvXb4v4hbHUO2GI9cJOhyXZ1fWgygn91E7G/exec";

        // Backup de segurança embutido localmente
        const textoBackupLocal = [
            { titulo: "Interface de um sistema:", conteudo: "É a interação entre o usuário e o sistema como: o layout onde visualiza conteúdos.", tipo: "normal" },
            { titulo: "Negócio de um sistema:", conteudo: "São as regras de negócio (informação que o sistema irá trazer, a forma como as mostramos e as funcionalidades que estarão disponíveis para o usuário) o que o usuário pode ou não fazer no sistema.", tipo: "normal" },
            { titulo: "Persistência de um sistema:", conteudo: "É a ponte entre negócio e dados. Manipula os dados, acessando e enviando para a camada de dados.", tipo: "normal" },
            { titulo: "Dados de um sistema:", conteudo: "Armazenamento dos dados em servidores e sistemas de gerenciamento de dados.", tipo: "normal" },
            { isSeparador: true, tituloSecao: "ESTRUTURA DE DADOS" },
            { titulo: "Para onde vão os dados?", conteudo: "Armazenamento temporário ou permanente.", tipo: "normal" },
            { titulo: "Armazenamento temporário:", conteudo: "Onde os dados podem ser manipulados ou processados. Memória RAM -> (Random Access Memory). Chamam-se variáveis esses espaços reservados na memória para guardar dados temporariamente.", tipo: "normal" },
            { titulo: "Armazenamento permanente:", conteudo: "Onde os dados ficam até serem requisitados pelo sistema. Depende do tipo de sistema e de como as informações precisam ser armazenadas (maior segurança, maior velocidade de acesso ou grande volume). O armazenamento geralmente é feito pelo HD.", tipo: "normal" },
            { titulo: "[Importante: HD]", conteudo: "O hard disk tem uma capacidade grande de armazenamento, porém a velocidade de acesso a esses dados é menor.", tipo: "aviso" },
            { titulo: "[Importante: RAM]", conteudo: "A Random Access Memory tem uma capacidade menor, mas a comunicação entre ela e o processador é mais rápida do que o HD. Por isso, ao fazer um software, é preciso prever que tipo de dado precisará manipular para saber quanto de memória será necessário reservar para executar as tarefas.", tipo: "aviso" }
        ];

        // LOGICA DE LEITURA (Puxa do Docs)
        async function carregarDadosGoogleDocs() {
            const listaCards = document.getElementById('listaCards');
            const statusTexto = document.getElementById('statusTexto');
            statusTexto.innerText = "Atualizando dados...";

            try {
                const resposta = await fetch(URL_LEITURA_PUB);
                if (!resposta.ok) throw new Error();
                const htmlTexto = await resposta.text();

                const parser = new DOMParser();
                const docInstancia = parser.parseFromString(htmlTexto, 'text/html');
                const corpoDocumento = docInstancia.getElementById('contents');
                if (!corpoDocumento) throw new Error();

                listaCards.innerHTML = "";
                const blocosTexto = corpoDocumento.innerText.split('---');

                blocosTexto.forEach(bloco => {
                    const linhas = bloco.split('\n').map(l => l.trim()).filter(l => l !== "");
                    if (linhas.length > 0) {
                        const primeiraLinha = linhas[0];

                        if (primeiraLinha === "ESTRUTURA DE DADOS") {
                            const h2 = document.createElement('h2');
                            h2.className = 'titulo-secao';
                            h2.innerText = primeiraLinha;
                            listaCards.appendChild(h2);
                            
                            if (linhas.length > 1) {
                                renderizarBlocoTexto(linhas[1], linhas.slice(2).join('<br>'));
                            }
                        } else {
                            renderizarBlocoTexto(primeiraLinha, linhas.slice(1).join('<br>'));
                        }
                    }
                });
                statusTexto.innerText = "Sincronizado com o Google Docs!";
            } catch (erro) {
                statusTexto.innerText = "Modo Local Ativo (Sem conexão externa)";
                carregarBackupLocal();
            }
        }

        // LOGICA DE ESCRITA (Envia para o Docs através do seu Apps Script)
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const btnSalvar = document.getElementById('btnSalvar');
            const statusTexto = document.getElementById('statusTexto');
            const titulo = document.getElementById('tituloInput').value;
            const conteudo = document.getElementById('textoInput').value;

            btnSalvar.disabled = true;
            statusTexto.innerText = "Enviando dados para o Google Docs...";

            // Cria o formato de formulário que a API espera receber
            const formData = new URLSearchParams();
            formData.append('titulo', titulo + ":");
            formData.append('conteudo', conteudo);

            try {
                // Envia a requisição do tipo POST usando no-cors para evitar bloqueios de CORS do navegador
                await fetch(URL_ESCRITA_API, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                statusTexto.innerText = "Salvo com sucesso! Atualizando lista...";
                document.getElementById('formCadastro').reset();
                
                // Aguarda um pequeno tempo para o Google processar e atualiza a lista na tela
                setTimeout(carregarDadosGoogleDocs, 2200);

            } catch (error) {
                console.error(error);
                statusTexto.innerText = "Erro ao salvar remotamente.";
            } finally {
                btnSalvar.disabled = false;
            }
        });

        function carregarBackupLocal() {
            const listaCards = document.getElementById('listaCards');
            listaCards.innerHTML = "";
            textoBackupLocal.forEach(item => {
                if (item.isSeparador) {
                    const h2 = document.createElement('h2');
                    h2.className = 'titulo-secao';
                    h2.innerText = item.tituloSecao;
                    listaCards.appendChild(h2);
                } else {
                    renderizarBlocoTexto(item.titulo, item.conteudo);
                }
            });
        }

        function renderizarBlocoTexto(titulo, conteudo) {
            const listaCards = document.getElementById('listaCards');
            const novoCard = document.createElement('div');
            novoCard.className = titulo.includes("[Importante") ? 'card card-aviso' : 'card';
            
            novoCard.innerHTML = `
                <button class="btn-excluir" onclick="excluirCard(this)">&times;</button>
                <h3>${titulo}</h3> 
                <p>${conteudo}</p>
            `;
            listaCards.appendChild(novoCard);
        }

        function excluirCard(botao) {
            botao.parentElement.remove();
        }

        window.onload = carregarDadosGoogleDocs;
    </script>
</body>
</html>
