<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Ensino: Camadas de Software</title>
    <style>
        /* Configurações Globais baseadas na imagem institucional */
        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        } 

        body {
            font-family: 'Times New Roman', Times, serif; /* Tipografia acadêmica formal */
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
            padding: 40px 20px;
        }

        /* Container Principal */
        .wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Cabeçalho Institucional */
        .header-principal {
            text-align: center;
            margin-bottom: 10px;
        }

        .header-principal h1 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .header-principal h4 {
            font-size: 14px;
            font-style: italic;
            font-weight: normal;
        }

        /* Formulário de Inserção sutil */
        .formulario {
            background-color: #f9f9f9;
            border: 1px dashed #000000;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .formulario input, .formulario textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            font-family: inherit;
            font-size: 14px;
        }

        .formulario button {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }

        .formulario button:hover {
            background-color: #e0e0e0;
        }

        /* Lista de Blocos */
        .lista-cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Título da seção estrutural */
        .titulo-secao {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            border-bottom: 2px solid #000000;
            padding-bottom: 3px;
        }

        /* Blocos (Cards) no estilo das caixas do Plano de Ensino */
        .card { 
            background-color: #ffffff; 
            border: 1px solid #000000; /* Borda fina preta idêntica à imagem */
            padding: 15px 20px;
            position: relative; 
        }

        .card h3 {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            padding-right: 30px; /* Evita que o texto sobreponha o botão X */
        }

        .card p {
            font-size: 14px;
            text-align: justify;
        }

        /* Variação para blocos de aviso importante */
        .card-aviso {
            background-color: #fcfcfc;
            border-left: 5px solid #000000; /* Destaque lateral sóbrio */
        }

        /* Botão de Excluir discreto */
        .btn-excluir {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #000000;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            opacity: 0.3;
        }

        .btn-excluir:hover {
            opacity: 1;
            color: #ff0000;
        }
    </style> 
</head> 
<body> 

    <div class="wrapper">
        <header class="header-principal">
            <h1>CAMADAS DE UM SOFTWARE:</h1> 
            <h4>Conforme o tamanho e a complexidade do sistema novas camadas podem ser criadas, mas em geral são essas:</h4> 
        </header> 

        <!-- Formulário para Inserir Conteúdo Dinamicamente -->
        <form class="formulario" id="meuFormulario">
            <input type="text" id="tituloInput" placeholder="Título do Bloco (ex: Camada de Segurança:)" required>
            <textarea id="textoInput" rows="2" placeholder="Digite a descrição ou conteúdo aqui..." required></textarea>
            <button type="submit">+ Inserir Novo Bloco</button>
        </form>

        <!-- Div onde os blocos serão gerados -->
        <div class="lista-cards" id="listaCards"></div> 
    </div>

    <script>
        // SEUS TEXTOS ORIGINAIS ARMAZENADOS DIRETAMENTE NO CÓDIGO
        const dadosOriginais = [
            {
                titulo: "Interface de um sistema:",
                conteudo: "É a interação entre o usuário e o sistema como: o layout onde visualiza conteúdos.",
                tipo: "normal"
            },
            {
                titulo: "Negócio de um sistema:",
                conteudo: "São as regras de negócio (informação que o sistema irá trazer, a forma como as mostramos e as funcionalidades que estarão disponíveis para o usuário) o que o usuário pode ou não fazer no sistema.",
                tipo: "normal"
            },
            {
                titulo: "Persistência de um sistema:",
                conteudo: "É a ponte entre negócio e dados. Manipula os dados, acessando e enviando para a camada de dados.",
                tipo: "normal"
            },
            {
                titulo: "Dados de um sistema:",
                conteudo: "Armazenamento dos dados em servidores e sistemas de gerenciamento de dados.",
                tipo: "normal"
            },
            {
                // Marcador especial para gerar o título de seção no momento certo
                isSeparador: true,
                tituloSeção: "ESTRUTURA DE DADOS"
            },
            {
                titulo: "Para onde vão os dados?",
                conteudo: "Armazenamento temporário ou permanente.",
                tipo: "normal"
            },
            {
                titulo: "Armazenamento temporário:",
                conteudo: "Onde os dados podem ser manipulados ou processados. Memória RAM -> (Random Access Memory). Chamam-se variáveis esses espaços reservados na memória para guardar dados temporariamente.",
                tipo: "normal"
            },
            {
                titulo: "Armazenamento permanente:",
                conteudo: "Onde os dados ficam até serem requisitados pelo sistema. Depende do tipo de sistema e de como as informações precisam ser armazenadas (maior segurança, maior velocidade de acesso ou grande volume). O armazenamento geralmente é feito pelo HD.",
                tipo: "normal"
            },
            {
                titulo: "<strong>[Importante: HD]</strong>",
                conteudo: "O hard disk tem uma capacidade grande de armazenamento, porém a velocidade de acesso a esses dados é menor.",
                tipo: "aviso"
            },
            {
                titulo: "<strong>[Importante: RAM]</strong>",
                conteudo: "A Random Access Memory tem uma capacidade menor, mas a comunicação entre ela e o processador é mais rápida do que o HD. Por isso, ao fazer um software, é preciso prever que tipo de dado precisará manipular para saber quanto de memória será necessário reservar para executar as tarefas.",
                tipo: "aviso"
            }
        ];

        const formulario = document.getElementById('meuFormulario');
        const listaCards = document.getElementById('listaCards');

        // Função responsável por desenhar um bloco na tela
        function renderizarCard(titulo, conteudo, tipo, noTopo = false) {
            const novoCard = document.createElement('div');
            novoCard.className = tipo === 'aviso' ? 'card card-aviso' : 'card';
            
            novoCard.innerHTML = `
                <button class="btn-excluir" onclick="excluirCard(this)">&times;</button>
                <h3>${titulo}</h3> 
                <p>${conteudo}</p>
            `;

            if (noTopo) {
                listaCards.insertBefore(novoCard, listaCards.firstChild);
            } else {
                listaCards.appendChild(novoCard);
            }
        }

        // Função para carregar a base de dados inicial
        function inicializarPagina() {
            listaCards.innerHTML = "";
            
            dadosOriginais.forEach(item => {
                if (item.isSeparador) {
                    const h2 = document.createElement('h2');
                    h2.className = 'titulo-secao';
                    h2.innerText = item.tituloSeção;
                    listaCards.appendChild(h2);
                } else {
                    renderizarCard(item.titulo, item.conteudo, item.tipo);
                }
            });
        }

        // Lógica para Adicionar manualmente pelo formulário
        formulario.addEventListener('submit', function(event) {
            event.preventDefault(); 

            const titulo = document.getElementById('tituloInput').value;
            const texto = document.getElementById('textoInput').value;

            // Insere o novo elemento customizado direto no topo da lista
            renderizarCard(titulo, texto, 'normal', true);
            formulario.reset();
        });

        // Lógica para Remover da tela
        function excluirCard(botao) {
            botao.parentElement.remove();
        }

        // Executa a carga dos dados assim que o navegador abre o arquivo
        window.onload = inicializarPagina;
    </script>

</body> 
</html>
